<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matt vs Deep — Ping Pong</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      #app { position: fixed; inset: 0; cursor: none; touch-action: none; }
      canvas { display: block; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; }
      .board { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;
               background: rgba(10, 12, 18, 0.7); border-radius: 12px; padding: 6px; backdrop-filter: blur(6px); }
      .pl { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 8px; font-weight: 600; }
      .p0 { background: rgba(59, 130, 246, 0.35); }
      .p1 { background: rgba(249, 115, 22, 0.35); }
      .sc { font-size: 28px; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
      .srv { width: 9px; height: 9px; border-radius: 50%; background: transparent; }
      .srv.on { background: #ffe066; box-shadow: 0 0 8px #ffe066; }
      .pl { position: relative; overflow: hidden; }
      .mtr { position: absolute; left: 6px; right: 6px; bottom: 2px; height: 5px; border-radius: 2px; background: rgba(255,255,255,0.12); }
      .mtr b { display: block; height: 100%; width: 0; border-radius: 2px; background: #ffc63a; transition: width 0.25s; }
      .pl.full .mtr b { animation: mglow 0.8s ease-in-out infinite; }
      .pl.armed .mtr b { background: #ff5a3c; box-shadow: 0 0 10px #ff5a3c; }
      .pl.armed { box-shadow: inset 0 0 0 2px #ff5a3c; }
      @keyframes mglow { 50% { box-shadow: 0 0 10px #ffc63a; filter: brightness(1.4); } }
      .superhint { position: absolute; top: 78px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 12px;
                   border-radius: 999px; background: rgba(10, 12, 18, 0.7); font-size: 13px; font-weight: 700;
                   letter-spacing: 0.06em; color: #ffc63a; text-shadow: 0 1px 4px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.2s; }
      .superhint.on { opacity: 1; }
      .flash { position: absolute; top: 22%; width: 100%; text-align: center; font-size: 22px; font-weight: 900; font-style: italic;
               letter-spacing: 0.08em; opacity: 0; transform: scale(0.9); transition: opacity 0.15s, transform 0.15s;
               -webkit-text-stroke: 1px rgba(0,0,0,0.45); text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
      .flash.show { opacity: 1; transform: scale(1); }
      .flash.top { color: #ff7a5c; } .flash.back { color: #6fb6ff; } .flash.side { color: #d39bff; }
      .flash.super { color: #ffc63a; font-size: clamp(32px, 7vw, 64px); -webkit-text-stroke: 1.5px #5a2a00;
                     text-shadow: 0 0 24px #ff8a00, 0 2px 10px rgba(0,0,0,0.8); }
      .hud .explore-help, .hud.exploring .help:not(.explore-help), .hud.exploring .board, .hud.exploring .superhint { display: none; }
      .hud.exploring .explore-help { display: flex; }
      .prompt { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%) translateY(8px); padding: 10px 18px;
                border-radius: 999px; background: rgba(10, 12, 18, 0.78); font-size: 16px; font-weight: 600; white-space: nowrap;
                opacity: 0; transition: opacity 0.15s, transform 0.15s; }
      .prompt.show { opacity: 1; transform: translateX(-50%); }
      .prompt kbd { display: inline-block; min-width: 1.4em; padding: 1px 7px; margin-right: 6px; border-radius: 6px;
                    background: #fff; color: #10131a; font: 800 14px system-ui, sans-serif; text-align: center; }
      .prompt em { font-style: normal; font-size: 12px; opacity: 0.6; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
      .chesspanel { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); min-width: 300px; max-width: calc(100% - 32px);
                    box-sizing: border-box; padding: 10px 16px; border-radius: 14px; background: rgba(10, 12, 18, 0.78);
                    backdrop-filter: blur(6px); text-align: center; }
      .chesspanel[hidden] { display: none; }
      .chesspanel .ct { font-size: 12px; opacity: 0.7; letter-spacing: 0.04em; }
      .chesspanel .cs { font-size: 20px; font-weight: 800; margin: 2px 0 4px; }
      .chesspanel .cm { font-size: 13px; font-variant-numeric: tabular-nums; opacity: 0.85; min-height: 1.2em; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
      .chesspanel .ck { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; margin-top: 6px; font-size: 12px; opacity: 0.75; }
      .chesspanel kbd { display: inline-block; padding: 0 6px; margin-right: 4px; border-radius: 5px; background: #fff; color: #10131a;
                        font: 800 11px system-ui, sans-serif; }
      .hud.seated .explore-help, .hud.seated .status { display: none; }
      @media (max-width: 600px) { .chesspanel .ck { display: none; } .chesspanel .cs { font-size: 17px; } }
      .msg { position: absolute; top: 34%; width: 100%; text-align: center; opacity: 0; transition: opacity 0.2s;
             text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7); }
      .msg.show { opacity: 1; }
      .msg .big { font-size: clamp(28px, 6vw, 56px); font-weight: 800; letter-spacing: -0.02em; }
      .msg .sub { font-size: 18px; opacity: 0.85; margin-top: 6px; }
      .help { position: absolute; bottom: 12px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px;
              justify-content: center; font-size: 12px; opacity: 0.8; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
      .status { position: absolute; top: 22px; right: 16px; font-size: 13px; opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
      .lobby { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 16, 0.55);
               backdrop-filter: blur(3px); color: #fff; z-index: 5; padding: 16px;
               grid-template-columns: minmax(0, 380px); justify-content: center; }
      .lobby[hidden] { display: none; }
      .lobby * { box-sizing: border-box; }
      .lobby .card { width: 100%; background: rgba(18, 22, 32, 0.92); border-radius: 16px; padding: 24px;
                     display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      .lobby h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.02em; text-align: center; }
      .lobby h1 span { opacity: 0.5; font-weight: 500; font-size: 0.7em; }
      .lobby p { margin: 0; line-height: 1.4; }
      .lobby button, .lobby input { font: inherit; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
                     padding: 11px 14px; background: rgba(255,255,255,0.06); color: #fff; }
      .lobby button { cursor: pointer; font-weight: 600; }
      .lobby button:hover { background: rgba(255,255,255,0.12); }
      .lobby button.primary { background: #3b82f6; border-color: #3b82f6; }
      .lobby button.ghost { background: transparent; border-color: transparent; opacity: 0.7; }
      .lobby .join, .lobby .link { display: flex; gap: 8px; }
      .lobby .join input, .lobby .link input { flex: 1; min-width: 0; text-transform: uppercase; }
      .lobby .link input { text-transform: none; font-size: 13px; }
      .lobby .code { font-size: 20px; letter-spacing: 0.12em; }
      .lobby .hint { font-size: 13px; opacity: 0.7; }
      .lobby .err { color: #fca5a5; }
      .lobby .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; }
      .lobby .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .lobby .char { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border-width: 2px; }
      .lobby .char i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
                       font-size: 24px; font-weight: 700; background: var(--c); box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
      .lobby .char small { opacity: 0.55; font-weight: 500; font-size: 12px; text-transform: capitalize; }
      .lobby .char.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
      .lobby .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; opacity: 0.85; cursor: pointer; padding: 2px 2px; }
      .lobby .toggle input { width: 16px; height: 16px; padding: 0; accent-color: #3b82f6; }
      .lobby kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.12); }
      .narration { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); width: min(760px, calc(100vw - 32px));
                   text-align: center; font: italic 400 24px/1.45 Georgia, 'Iowan Old Style', 'Times New Roman', serif;
                   color: #f6efe1; text-shadow: 0 1px 2px rgba(0,0,0,0.8), 0 0 24px rgba(0,0,0,0.65);
                   opacity: 0; transition: opacity 0.8s; pointer-events: none; text-wrap: balance;
                   padding: 18px 40px; background: radial-gradient(closest-side, rgba(8,10,16,0.55), rgba(8,10,16,0.3) 60%, transparent); }
      .narration.show { opacity: 1; }
      .narration span { opacity: 0; filter: blur(3px); transition: opacity 0.5s ease-out, filter 0.5s ease-out; }
      .narration span.on { opacity: 1; filter: none; }
      @media (prefers-reduced-motion: reduce) { .narration span { transition: none; opacity: 1; filter: none; } }
      @media (max-width: 600px) { .narration { font-size: 18px; top: 10%; } }
      .lobby .wait { opacity: 0.8; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (max-width: 600px) { .help, .hud.exploring .explore-help { display: none; } .status { top: auto; bottom: 12px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
